<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanalbay Creative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');
       
        body {
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 300;
            scroll-behavior: smooth;
            background: #0a0a0a;
            color: #f1f5f9;
        }
        .heading { font-family: 'Playfair Display', sans-serif; }

        .glass-nav {
            background: rgba(10, 10, 10, 0.72);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(45, 212, 191, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .nav-link:hover { color: #14b8a6; }

        .hero-title {
            animation: titleZoom 1.4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }
        @keyframes titleZoom {
            0% { opacity: 0; transform: scale(0.75) translateY(60px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* PORTFÖY KARTLARI - Basit Turkuaz Border */
        .video-card {
            background: #111113;
            border: 1px solid rgba(45, 212, 191, 0.3);
            transition: all 0.4s ease;
        }

        .video-card:hover {
            border-color: #14b8a6;
            border-width: 2px;
            box-shadow: 0 0 0 1px rgba(20, 184, 166, 0.1);
        }

        .explore-btn {
            background: linear-gradient(to right, #14b8a6, #22d3ee);
            color: black;
            transition: all 0.4s ease;
        }
        .explore-btn:hover {
            background: linear-gradient(to right, #27272a, #3f3f46);
            color: white;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-slate-200 overflow-x-hidden">

    <!-- NAVBAR -->
    <nav class="glass-nav fixed top-4 left-1/2 -translate-x-1/2 z-50 rounded-3xl px-6 py-3.5 shadow-2xl w-[90%] max-w-[340px]">
        <div class="flex items-center justify-between">
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a onclick="smoothScrollTo('home')" class="nav-link cursor-pointer hover:text-teal-400 transition">Ana Sayfa</a>
                <a onclick="smoothScrollTo('portfolio')" class="nav-link cursor-pointer hover:text-teal-400 transition">Portföy</a>
                <a onclick="smoothScrollTo('contact')" class="nav-link cursor-pointer hover:text-teal-400 transition">İletişim</a>
            </div>

            <button id="hamburger" class="md:hidden text-2xl">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden mt-5 pt-5 border-t border-teal-400/30">
            <div class="flex flex-col gap-4 text-center">
                <a onclick="smoothScrollTo('home'); closeMobileMenu()" class="nav-link py-3 cursor-pointer hover:text-teal-400">Ana Sayfa</a>
                <a onclick="smoothScrollTo('portfolio'); closeMobileMenu()" class="nav-link py-3 cursor-pointer hover:text-teal-400">Portföy</a>
                <a onclick="smoothScrollTo('contact'); closeMobileMenu()" class="nav-link py-3 cursor-pointer hover:text-teal-400">İletişim</a>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section id="home" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-zinc-950 via-[#0a0a0a] to-black pt-20">
        <div class="max-w-5xl mx-auto text-center px-6">
            <h1 class="heading text-6xl md:text-7xl lg:text-8xl font-bold tracking-tighter leading-none mb-6 hero-title text-white">
                KANALBAY<br>CREATIVE
            </h1>
            <p class="text-xl md:text-2xl text-zinc-400 fade-in" style="animation-delay: 400ms">
                Sinematik Hikâyeler • Görsel Dünyalar
            </p>
           
            <div class="mt-20 flex flex-col sm:flex-row gap-6 justify-center fade-in" style="animation-delay: 700ms">
                <button onclick="smoothScrollTo('portfolio')" class="explore-btn px-12 py-7 rounded-3xl text-lg font-medium flex items-center gap-3">
                    Portföyleri Keşfet <i class="fa-solid fa-arrow-down"></i>
                </button>
                <button onclick="smoothScrollTo('contact')" class="px-12 py-7 rounded-3xl text-lg font-medium border border-zinc-600 hover:border-teal-400 hover:bg-zinc-900 transition-all">
                    İletişime Geç
                </button>
            </div>
        </div>
    </section>

    <!-- PORTFOLIO -->
    <section id="portfolio" class="py-28 bg-[#0a0a0a]">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="heading text-5xl md:text-6xl font-bold text-center mb-20 fade-in section-title">Portföy</h2>
            
            <div class="mb-28">
                <h3 class="section-title text-3xl mx-auto mb-12 text-center fade-in">Görsel Çalışmalar</h3>
                <div id="visual-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </div>

            <div>
                <h3 class="section-title text-3xl mx-auto mb-12 text-center fade-in">Video Çalışmalar</h3>
                <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="py-28 bg-black">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h2 class="heading text-5xl md:text-6xl mb-16 fade-in">İletişime Geç</h2>
            <div class="flex flex-col items-center gap-10">
                <a href="mailto:kanalbaycreative@gmail.com" class="flex items-center gap-5 text-2xl hover:text-teal-400 transition group">
                    <i class="fa-solid fa-envelope text-4xl group-hover:scale-110 transition"></i>
                    <span>kanalbaycreative@gmail.com</span>
                </a>
                <a href="https://instagram.com/kanalbaycreative" target="_blank" class="flex items-center gap-5 text-2xl hover:text-teal-400 transition group">
                    <i class="fa-brands fa-instagram text-4xl group-hover:scale-110 transition"></i>
                    <span>@kanalbaycreative</span>
                </a>
            </div>
        </div>
    </section>

    <footer class="py-12 text-center text-zinc-500 text-sm border-t border-zinc-900">
        © 2026 Kanalbay Creative • Tüm Hakları Saklıdır
    </footer>

    <!-- VIDEO MODAL -->
    <div id="video-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="w-full max-w-5xl bg-zinc-900 rounded-3xl overflow-hidden">
            <div class="p-6 border-b border-zinc-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-medium"></h3>
                <button onclick="closeModal()" class="text-4xl hover:text-teal-400 transition">×</button>
            </div>
            <div id="modal-player" class="aspect-video bg-black"></div>
        </div>
    </div>

    <script>
        // Veriler ve scriptler (tam hali)
        const visualWorks = [
            { title: "Metin2TC - Karakter Paketi", img: "https://picsum.photos/id/1015/800/600", desc: "Oyun içi karakter ve logo tasarımı" },
            { title: "Kafkas 2 - Afiş Serisi", img: "https://picsum.photos/id/201/800/600", desc: "Sinematik tanıtım afişleri" },
            { title: "Kuzey 2 - Konsept Sanat", img: "https://picsum.photos/id/237/800/600", desc: "Karakter ve dünya tasarımı" },
            { title: "Mergen 2 - UI Tasarım", img: "https://picsum.photos/id/180/800/600", desc: "Kullanıcı arayüzü çalışmaları" }
        ];

        const videoProjects = [
            { title: "Metin2TC", thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/metin2tc.png", isSpecial: true, videos: [
                { id: "JOWkXkDfFr8", title: "Video 1" },
                { id: "7LhpRxpch54", title: "Video 2" },
                { id: "lMpO_31ffnc", title: "Video 3" }
            ]},
            { id: "BURAYA_KAFKAS2_ID", title: "Kafkas2", thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/kafkas2.png" },
            { id: "BURAYA_KUZEY2_ID", title: "Kuzey2", thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/kuzey2.png" },
            { id: "BURAYA_MERGEN2_ID", title: "Mergen2", thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/mergen2.png" }
        ];

        // Mobil Menü ve diğer fonksiyonlar
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        let isOpen = false;

        function toggleMobileMenu() {
            isOpen = !isOpen;
            if (isOpen) {
                mobileMenu.classList.remove('hidden');
                hamburger.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else {
                mobileMenu.classList.add('hidden');
                hamburger.innerHTML = '<i class="fa-solid fa-bars"></i>';
            }
        }

        function closeMobileMenu() {
            isOpen = false;
            mobileMenu.classList.add('hidden');
            hamburger.innerHTML = '<i class="fa-solid fa-bars"></i>';
        }

        hamburger.addEventListener('click', toggleMobileMenu);

        function smoothScrollTo(id) {
            document.getElementById(id).scrollIntoView({ behavior: "smooth" });
            if (window.innerWidth < 768) closeMobileMenu();
        }

        function handleScrollAnimations() {
            const elements = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, i) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => entry.target.classList.add('visible'), i * 80);
                    }
                });
            }, { threshold: 0.15 });
            elements.forEach(el => observer.observe(el));
        }

        function renderVisuals() {
            let html = '';
            visualWorks.forEach(work => {
                html += `
                    <div class="video-card rounded-3xl overflow-hidden group cursor-pointer fade-in">
                        <img src="${work.img}" loading="lazy" class="w-full h-64 object-cover" alt="${work.title}">
                        <div class="p-6">
                            <h3 class="text-xl font-medium mb-2">${work.title}</h3>
                            <p class="text-zinc-400 text-sm">${work.desc}</p>
                        </div>
                    </div>
                `;
            });
            document.getElementById('visual-grid').innerHTML = html;
        }

        function renderVideos() {
            let html = '';
            videoProjects.forEach(p => {
                if (p.isSpecial) {
                    html += `
                        <div onclick="toggleMetin2TC(this)" class="video-card rounded-3xl cursor-pointer overflow-hidden md:col-span-2 fade-in">
                            <img src="${p.thumbnail}" loading="lazy" class="w-full h-64 object-contain p-8 bg-black" alt="${p.title}">
                            <div class="p-6 text-center">
                                <h3 class="text-2xl font-medium">${p.title}</h3>
                                <p class="text-teal-400 text-sm mt-1">3 Video • Özel İçerik</p>
                            </div>
                        </div>
                        <div id="metin2tc-videos" class="hidden md:col-span-2 grid grid-cols-1 gap-4 mt-6"></div>
                    `;
                } else if (p.id) {
                    html += `
                        <div onclick="playVideo('${p.id}', '${p.title}')" class="video-card rounded-3xl cursor-pointer overflow-hidden fade-in">
                            <img src="${p.thumbnail}" loading="lazy" class="w-full h-64 object-contain p-8 bg-black" alt="${p.title}">
                            <div class="p-6 text-center">
                                <h3 class="text-xl font-medium">${p.title}</h3>
                            </div>
                        </div>
                    `;
                }
            });
            document.getElementById('video-grid').innerHTML = html;
        }

        function toggleMetin2TC(card) {
            const sub = document.getElementById('metin2tc-videos');
            sub.classList.toggle('hidden');
            if (!sub.classList.contains('hidden')) {
                let html = '';
                videoProjects[0].videos.forEach(v => {
                    html += `
                        <div onclick="playVideo('${v.id}', '${v.title}')" 
                             class="bg-zinc-900 p-6 rounded-2xl cursor-pointer flex items-center gap-4 hover:bg-zinc-800 transition">
                            <i class="fa-solid fa-play text-teal-400"></i>
                            <span>${v.title}</span>
                        </div>
                    `;
                });
                sub.innerHTML = html;
            }
        }

        function playVideo(id, title) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-player').innerHTML = `
                <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" 
                        frameborder="0" allowfullscreen allow="autoplay"></iframe>
            `;
            document.getElementById('video-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('video-modal').classList.add('hidden');
        }

        window.onload = () => {
            renderVisuals();
            renderVideos();
            handleScrollAnimations();
        };
    </script>
</body>
</html>
