<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Kanalbay Creative</title>

<meta name="description" content="Sinematik hikâyeler ve unutulmaz görsel dünyalar yaratıyoruz.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

:root{
    --bg:#050505;
    --teal:#14b8a6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:white;
    overflow-x:hidden;
}

.heading{
    font-family:'Playfair Display',serif;
}

/* NOISE */
.noise{
    position:fixed;
    inset:0;
    opacity:.03;
    pointer-events:none;
    background-image:url("https://grainy-gradients.vercel.app/noise.svg");
    z-index:999;
}

/* CURSOR */
.cursor-glow{
    position:fixed;
    width:300px;
    height:300px;
    background:radial-gradient(circle,rgba(20,184,166,.12),transparent 70%);
    pointer-events:none;
    z-index:2;
    transform:translate(-50%,-50%);
}

/* NAVBAR */
.glass-nav{
    backdrop-filter:blur(24px);
    background:rgba(10,10,10,.55);
    border:1px solid rgba(255,255,255,.06);
}

.nav-link{
    position:relative;
    transition:.4s;
}

.nav-link::after{
    content:'';
    position:absolute;
    bottom:-8px;
    left:0;
    width:0%;
    height:1px;
    background:var(--teal);
    transition:.4s;
}

.nav-link:hover{
    color:var(--teal);
}

.nav-link:hover::after{
    width:100%;
}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.hero-title{
    font-size:clamp(3rem,9vw,8rem);
    line-height:.95;
    letter-spacing:-0.07em;
}

.gradient-text{
    background:linear-gradient(90deg,#14b8a6,#67e8f9,#14b8a6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.btn-primary{
    background:linear-gradient(145deg,#151515,#090909);
    border:1px solid rgba(255,255,255,.08);
    transition:.5s;
}

.btn-primary:hover{
    transform:translateY(-5px);
    border-color:rgba(20,184,166,.6);
    box-shadow:0 20px 60px rgba(20,184,166,.15);
}

/* SECTION */
.section{
    padding:140px 0;
}

.section-title{
    font-size:clamp(3rem,6vw,5rem);
}

/* SCROLL */
.fade-up{
    opacity:0;
    transform:translateY(60px);
    transition:1s cubic-bezier(.16,1,.3,1);
}

.fade-up.show{
    opacity:1;
    transform:translateY(0);
}

/* ========================= */
/* 🔥 FIXED VIDEO CARDS */
/* ========================= */

.video-card{
    position:relative;
    overflow:hidden;
    border-radius:32px;
    background:#0f0f10;
    cursor:pointer;
    isolation:isolate;
    padding:1px;
}

.video-card::before{
    content:'';
    position:absolute;
    width:220%;
    height:220%;
    top:-60%;
    left:-60%;
    background:conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 120deg,
        rgba(20,184,166,.95) 180deg,
        transparent 240deg,
        transparent 360deg
    );
    animation:rotateBorder 4s linear infinite;
}

.video-card::after{
    content:'';
    position:absolute;
    inset:1px;
    border-radius:31px;
    background:#0b0b0c;
    z-index:1;
}

@keyframes rotateBorder{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.video-inner{
    position:relative;
    z-index:2;
    overflow:hidden;
    border-radius:30px;
    aspect-ratio:16/9;
}

.video-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:1s;
}

.video-card:hover img{
    transform:scale(1.06);
}

.video-card:hover{
    transform:translateY(-8px);
    transition:.5s;
    box-shadow:0 30px 80px rgba(20,184,166,.18);
}

.video-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.2));
}

.video-content{
    position:absolute;
    bottom:0;
    left:0;
    padding:32px;
}

/* VIDEO LIST */
.video-list{
    display:none;
    margin-top:20px;
    gap:14px;
    flex-direction:column;
}

.video-item{
    background:#101010;
    border:1px solid rgba(255,255,255,.06);
    padding:22px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:16px;
    cursor:pointer;
}

/* CATEGORY */
.category-tabs{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:50px;
}

.category-btn{
    padding:14px 26px;
    border-radius:999px;
    background:#101010;
    border:1px solid rgba(255,255,255,.06);
}

.category-btn.active,
.category-btn:hover{
    border-color:rgba(20,184,166,.5);
    color:#14b8a6;
}

/* GRID */
.design-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.design-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:24px;
}

.design-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* RESPONSIVE */
@media(max-width:1024px){
    .design-grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:640px){
    .section{padding:90px 0;}
    .design-grid{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<div class="noise"></div>
<div class="cursor-glow"></div>

<nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-8 py-5 rounded-full glass-nav w-[92%] max-w-[620px]">
<div class="flex justify-center gap-10 text-sm uppercase tracking-[0.2em]">
<a href="#home" class="nav-link">Ana Sayfa</a>
<a href="#portfolio" class="nav-link">Portföy</a>
<a href="#contact" class="nav-link">İletişim</a>
</div>
</nav>

<section id="home" class="hero">
<div class="text-center fade-up">
<h1 class="hero-title heading font-bold">
KANALBAY <br><span class="gradient-text">CREATIVE</span>
</h1>
</div>
</section>

<section id="portfolio" class="section">

<div class="grid md:grid-cols-2 gap-8">

<!-- METIN2TC -->
<div>

<div class="video-card fade-up" onclick="toggleVideos('metin2tcVideos')">

<div class="video-inner">

<img src="https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/metin2tc.png">

<div class="video-overlay"></div>

<div class="video-content">
<h3 class="text-4xl">Metin2TC</h3>
</div>

</div>

</div>

<div id="metin2tcVideos" class="video-list">

<div class="video-item" onclick="openVideo('JOWkXkDfFr8')">Video 1</div>
<div class="video-item" onclick="openVideo('7LhpRxpch54')">Video 2</div>
<div class="video-item" onclick="openVideo('lMpO_31ffnc')">Video 3</div>

</div>

</div>

</div>

</section>

<script>

const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting)e.target.classList.add('show');
});
});

document.querySelectorAll('.fade-up').forEach(e=>observer.observe(e));

function toggleVideos(id){
const el=document.getElementById(id);
el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
}

function openVideo(id){
window.open("https://www.youtube.com/watch?v="+id,"_blank");
}

</script>

</body>
</html>
