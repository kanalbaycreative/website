<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanalbay Creative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            font-weight: 300;
            scroll-behavior: smooth;
        }
        .heading { font-family: 'Playfair Display', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-btn:hover, .hero-btn:hover {
            background: #14b8a6;
            color: black;
        }

        .section-title {
            position: relative;
            display: inline-block;
        }
        .section-title:after {
            content: '';
            position: absolute;
            width: 80%;
            height: 3px;
            background: linear-gradient(to right, transparent, #14b8a6, transparent);
            bottom: -10px;
            left: 10%;
        }

        .video-card {
            background: #0a0a0a;
            border: 1px solid rgba(20, 184, 166, 0.25);
            transition: all 0.4s ease;
        }
        .video-card:hover {
            border-color: #14b8a6;
            box-shadow: inset 0 0 20px rgba(20, 184, 166, 0.25);
        }

        .video-thumbnail {
            width: 100%;
            height: 240px;
            object-fit: contain;
            object-position: center;
            background: #111113;
            padding: 30px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">

    <!-- NAVBAR -->
    <nav class="fixed top-4 left-1/2 -translate-x-1/2 z-50 glass rounded-3xl px-6 py-4 shadow-2xl">
        <div class="flex items-center gap-4 md:gap-8 text-sm font-medium">
            <a onclick="smoothScrollTo('home')" class="nav-btn glass-btn px-7 py-3 rounded-2xl cursor-pointer">Ana Sayfa</a>
            <a onclick="smoothScrollTo('portfolio')" class="nav-btn glass-btn px-7 py-3 rounded-2xl cursor-pointer">Portföy</a>
            <a onclick="smoothScrollTo('contact')" class="nav-btn glass-btn px-7 py-3 rounded-2xl cursor-pointer">İletişim</a>
        </div>
    </nav>

    <!-- HERO -->
    <section id="home" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-zinc-900 via-zinc-950 to-black">
        <div class="max-w-4xl mx-auto text-center px-6">
            <h1 class="heading text-6xl md:text-7xl lg:text-8xl font-bold tracking-tighter leading-none mb-6">
                KANALBAY<br>CREATIVE
            </h1>
            <p class="text-xl md:text-2xl text-zinc-400">Sinematik Hikâyeler • Görsel Dünyalar</p>
            
            <div class="mt-16 flex flex-col sm:flex-row gap-5 justify-center">
                <button onclick="smoothScrollTo('portfolio')" 
                        class="hero-btn px-10 py-6 rounded-3xl text-lg font-medium flex items-center gap-3">Portföyleri Keşfet <i class="fa-solid fa-arrow-down"></i></button>
                <button onclick="smoothScrollTo('contact')" 
                        class="hero-btn px-10 py-6 rounded-3xl text-lg font-medium border border-white/40 hover:border-teal-400">İletişime Geç</button>
            </div>
        </div>
    </section>

    <!-- PORTFOLIO -->
    <section id="portfolio" class="py-24 bg-zinc-900">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="heading text-5xl md:text-6xl font-bold text-center mb-20">Portföy</h2>

            <div class="mb-24">
                <h3 class="section-title text-3xl mx-auto mb-12 text-center">Görsel Çalışmalar</h3>
                <div id="visual-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div>
                <h3 class="section-title text-3xl mx-auto mb-12 text-center">Video Çalışmalar</h3>
                <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="py-24 bg-black">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h2 class="heading text-5xl md:text-6xl mb-12">İletişime Geç</h2>
            <a href="mailto:kanalbaycreative@gmail.com" class="text-2xl hover:text-teal-400 block mb-6">kanalbaycreative@gmail.com</a>
            <a href="https://instagram.com/kanalbaycreative" target="_blank" class="text-2xl hover:text-teal-400">@kanalbaycreative</a>
        </div>
    </section>

    <footer class="py-10 text-center text-zinc-500 text-sm">
        © 2026 Kanalbay Creative • Tüm Hakları Saklıdır
    </footer>

    <!-- VIDEO MODAL -->
    <div id="video-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="w-full max-w-5xl bg-zinc-900 rounded-3xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-medium"></h3>
                <button onclick="closeModal()" class="text-4xl">×</button>
            </div>
            <div id="modal-player" class="aspect-video bg-black"></div>
        </div>
    </div>

    <script>
        const videoProjects = [
            { 
                id: "PLIgadixzvY9iLcDWWGcoLyM9mAHSOTH_d", 
                title: "Metin2TC", 
                isPlaylist: true,
                thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/metin2tc.png" 
            },
            { 
                id: "VIDEO_ID_BURAYA", 
                title: "Kafkas2", 
                isPlaylist: false,
                thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/kafkas2.png" 
            },
            { 
                id: "VIDEO_ID_BURAYA", 
                title: "Kuzey2", 
                isPlaylist: false,
                thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/kuzey2.png" 
            },
            { 
                id: "VIDEO_ID_BURAYA", 
                title: "Mergen2", 
                isPlaylist: false,
                thumbnail: "https://raw.githubusercontent.com/kanalbaycreative/website/main/logos/mergen2.png" 
            }
        ];

        function smoothScrollTo(id) {
            document.getElementById(id).scrollIntoView({ behavior: "smooth" });
        }

        function renderVideos() {
            document.getElementById('video-grid').innerHTML = videoProjects.map(p => `
                <div onclick="playVideo('${p.id}', '${p.title}', ${p.isPlaylist})" 
                     class="video-card rounded-3xl cursor-pointer overflow-hidden">
                    <img src="${p.thumbnail}" loading="lazy" class="video-thumbnail" alt="${p.title}">
                    <div class="p-6 text-center">
                        <h3 class="text-xl font-medium tracking-wider">${p.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function playVideo(id, title, isPlaylist) {
            document.getElementById('modal-title').textContent = title;
            
            let embedUrl = isPlaylist 
                ? `https://www.youtube.com/embed/videoseries?list=${id}&autoplay=1` 
                : `https://www.youtube.com/embed/${id}?autoplay=1`;

            document.getElementById('modal-player').innerHTML = `
                <iframe width="100%" height="100%" 
                        src="${embedUrl}" 
                        frameborder="0" 
                        allowfullscreen 
                        allow="autoplay">
                </iframe>
            `;
            document.getElementById('video-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('video-modal').classList.add('hidden');
        }

        window.onload = renderVideos;
    </script>
</body>
</html>
